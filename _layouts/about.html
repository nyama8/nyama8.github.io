---
layout: default
---
<section class="card profile">
  <img class="profile-photo" src="{{ '/assets/img/profile.jpg' | relative_url }}"
       alt="Photo of {{ site.author.name }}" width="480" height="640">
  <div class="profile-text">
    <h1 class="profile-name">{{ site.author.name }}</h1>
    <p class="profile-position">{{ site.author.position }}</p>
    <ul class="profile-links">
      <li><a href="mailto:{{ site.author.email }}">{% include icon.html name="email" %}<span>Email</span></a></li>
      <li><a href="{{ site.author.scholar }}">{% include icon.html name="scholar" %}<span>Google Scholar</span></a></li>
      <li><a href="{{ site.author.github }}">{% include icon.html name="github" %}<span>GitHub</span></a></li>
      <li><a href="{{ site.cv_pdf | relative_url }}" target="_blank" rel="noopener">{% include icon.html name="cv" %}<span>CV (PDF)</span></a></li>
    </ul>
  </div>
</section>

<section class="card prose">
  <h2>About</h2>
  {{ content }}
</section>
