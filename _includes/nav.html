<header class="site-header">
  <nav class="nav" aria-label="Main">
    <a class="nav-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <ul class="nav-links">
      {%- for item in site.nav %}
      <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url or item.url != "/" and page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {%- endfor %}
      <li><a href="{{ site.cv_pdf | relative_url }}" target="_blank" rel="noopener">CV</a></li>
      <li>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
          <span class="icon-moon">{% include icon.html name="moon" %}</span>
          <span class="icon-sun">{% include icon.html name="sun" %}</span>
        </button>
      </li>
    </ul>
  </nav>
</header>
