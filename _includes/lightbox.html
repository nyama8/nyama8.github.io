<script>
  // Image viewer ("lightbox"). Links with class="zoom" (gallery tiles and highlight
  // figures) open their image large, in front of the page, with the figure's caption.
  // Close with the × button, a click outside the image, or the Esc key.
  // Without this script the same links simply open the image in a new tab.
  (function () {
    var links = document.querySelectorAll("a.zoom");
    if (!links.length || typeof HTMLDialogElement !== "function") return;

    var dialog = document.createElement("dialog");
    dialog.className = "lightbox";
    dialog.innerHTML =
      '<button class="lightbox-close" type="button" aria-label="Close">{% include icon.html name="close" %}</button>' +
      '<figure><img alt=""><figcaption></figcaption></figure>';
    document.body.appendChild(dialog);
    var img = dialog.querySelector("img");
    var caption = dialog.querySelector("figcaption");

    links.forEach(function (link) {
      link.addEventListener("click", function (event) {
        // Cmd/Ctrl/Shift-click still opens a new tab, as browsers normally do.
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        var thumb = link.querySelector("img");
        var figcaption = link.closest("figure") && link.closest("figure").querySelector("figcaption");
        img.src = link.href;
        img.alt = thumb ? thumb.alt : "";
        caption.innerHTML = figcaption ? figcaption.innerHTML : "";
        caption.hidden = !figcaption;
        dialog.showModal();
      });
    });

    // A click anywhere except on the picture or its caption closes the viewer.
    dialog.addEventListener("click", function (event) {
      if (!event.target.closest("img, figcaption")) dialog.close();
    });
    dialog.addEventListener("close", function () { img.removeAttribute("src"); });
  })();
</script>
