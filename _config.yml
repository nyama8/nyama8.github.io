# Site settings. After editing this file, restart `bundle exec jekyll serve`
# (it is the one file that is not reloaded automatically).

title: Nick Yama
description: >-
  Personal academic website of Nicholas S. Yama, IC Postdoctoral Fellow at the
  University of California, Berkeley.
url: "https://nyama8.github.io"
baseurl: ""
lang: en

author:
  name: Nicholas S. Yama
  position: IC Postdoctoral Fellow at the University of California, Berkeley
  email: nsyama@berkeley.edu
  scholar: https://scholar.google.com/citations?user=X5lPmGYAAAAJ&hl=en
  github: https://github.com/nyama8
  linkedin: https://www.linkedin.com/in/nick-yama-359741203/

# Name spellings to show in bold in author lists (as written in _data/publications.yml).
author_names:
  - Nicholas S. Yama
  - Nicholas Yama

# The CV PDF. To update it, replace assets/pdf/cv.pdf with the new file (same name).
cv_pdf: /assets/pdf/cv.pdf

# Top navigation, in order.
nav:
  - title: About
    url: /
  - title: Research
    url: /research/
  - title: Publications
    url: /publications/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: pretty

# Research topics: one Markdown file per topic in the _topics folder.
# Each becomes its own page at /research/<file name>/ and a card on the Research page.
collections:
  topics:
    output: true
    permalink: /research/:name/

# Topic pages use the "topic" layout without having to say so in each file.
defaults:
  - scope:
      type: topics
    values:
      layout: topic

# Files in the repo that are not part of the website.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .ruby-version
